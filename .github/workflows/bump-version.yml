name: Version de l'application

# Filet de sécurité : à chaque push sur main qui ne modifie pas déjà version.json,
# on incrémente la version pour déclencher la bannière « Mise à jour disponible ».
on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: bump-version
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Version déjà modifiée ?
        id: check
        run: |
          if git diff --name-only HEAD~1 HEAD | grep -qx 'version.json'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Incrémenter version.json
        if: steps.check.outputs.skip != 'true'
        run: |
          scripts/bump-version.sh
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add version.json
          git commit -m "Version $(sed -n 's/.*"version": "\(.*\)".*/\1/p' version.json) : bannière de mise à jour"
          git push
